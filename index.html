<title>好设计两百年</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* 版式：像一本博物馆藏品图录。顶部一条 1850–2030 的年代刻度把 87 件作品排成点阵；
   主体是疏密有致的图片网格（建筑满版出血、产品放在灰色影棚底上）；点作品看大图，点设计师滑出人物卡。
   配色取自 Braun 产品的面板：暖灰底、黑字，四个类别用 ET66 按键式的点色区分。 */
:root {
  --paper: #f2f2ef; --tile: #e6e6e2; --card: #fbfbf9; --ink: #141414; --muted: #6d6d68; --rule: #d3d3cd;
  --c-arch: #34558b; --c-home: #a8642a; --c-appliance: #e0531c; --c-tech: #2f8a5b; --c-mobility: #6b4fa3;
  --display: "Archivo", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  --text: "Archivo", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121211; --tile: #1d1d1b; --card: #181817; --ink: #ecebe7; --muted: #9a9a93; --rule: #33332f;
  --c-arch: #7c9cd6; --c-home: #d49559; --c-appliance: #ff7a45; --c-tech: #5cc28d; --c-mobility: #b29ae6; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121211; --tile: #1d1d1b; --card: #181817; --ink: #ecebe7; --muted: #9a9a93; --rule: #33332f;
  --c-arch: #7c9cd6; --c-home: #d49559; --c-appliance: #ff7a45; --c-tech: #5cc28d; --c-mobility: #b29ae6; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--text); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper) }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--c-appliance); outline-offset: 3px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0 }
.label { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none }
.dot.arch { background: var(--c-arch) } .dot.home { background: var(--c-home) } .dot.appliance { background: var(--c-appliance) } .dot.tech { background: var(--c-tech) } .dot.mobility { background: var(--c-mobility) }

/* ---------- 开篇 ---------- */
header.hero { padding-block: 56px 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 56px; align-items: end }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 112%; font-size: clamp(56px, 10.5vw, 168px); line-height: 1.02; letter-spacing: -.02em }
.hero h1 small { display: block; font-size: .2em; font-weight: 500; font-stretch: 100%; letter-spacing: -.01em; margin-top: 18px; color: var(--muted) }
.hero .intro { font-size: 17px; line-height: 1.7; max-width: 34em; margin: 0 }
.hero .intro b { font-weight: 600 }
.counts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 18px }
.counts span { display: inline-flex; align-items: center; gap: 8px; font-size: 14px }
.counts b { font: 500 14px var(--mono) }
@media (max-width: 860px) { header.hero { grid-template-columns: 1fr; padding-block: 36px 20px } }
header.hero { position: relative } :root[lang="en"] .hero h1 { font-size: clamp(48px, 8.4vw, 136px) }
@media (max-width: 640px) { header.hero { padding-top: 64px } }

/* ---------- 年代刻度 ---------- */
.ruler { position: relative; margin-block: 8px 34px; padding-block: 14px 30px; border-top: 2px solid var(--ink) }
.ruler .track { position: relative; height: 92px }
.ruler .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule) }
.ruler .tick span { position: absolute; bottom: -24px; left: 0; transform: translateX(-50%); font: 11px var(--mono); color: var(--muted) }
.ruler .pt { position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; border: 2px solid var(--paper); transition: transform .15s }
.ruler .pt:hover, .ruler .pt:focus-visible { transform: scale(1.6); z-index: 2 }
.ruler .pt.off { opacity: .15 }
.ruler .tip { position: absolute; top: -34px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12px; padding: 3px 9px; white-space: nowrap; pointer-events: none; border-radius: 2px }

/* ---------- 筛选条 ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule) }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-block: 12px }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px }
.tab { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; padding-block: 2px; border-bottom: 2px solid transparent }
.tab sup { font: 500 11px var(--mono); vertical-align: top }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.bar .right { margin-left: auto; display: flex; gap: 14px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px }
.seg button { font-size: 13px; padding: 4px 12px; border-radius: 999px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
.corner { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); z-index: 25; display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px) }
.corner > button { height: 30px; min-width: 30px; border-radius: 999px; display: grid; place-items: center; color: var(--ink) }
.corner > button:hover { background: var(--tile) }
.corner .lang { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font: 600 12px/1 var(--mono); letter-spacing: .06em; padding: 0 10px }
.corner .lang span { color: var(--muted); font-weight: 500 } .corner .lang b { font-weight: 600 }
.corner i { width: 1px; height: 16px; background: var(--rule); margin: 0 2px }
.theme { width: 30px }
.theme svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round }
.theme .sun { display: none } :root[data-mode="dark"] .theme .sun { display: block } :root[data-mode="dark"] .theme .moon { display: none }
@media (max-width: 640px) { .bar .wrap { flex-wrap: nowrap; gap: 10px } .tabs { flex-wrap: nowrap; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none } .tabs::-webkit-scrollbar { display: none } .tab { font-size: 15px; white-space: nowrap } .tab sup { display: none } .bar .right { margin-left: 0; gap: 8px } .seg button { padding: 4px 9px } }

/* ---------- 网格 ---------- */
main { padding-block: 30px 40px }
.group-head { display: flex; align-items: baseline; gap: 16px; margin: 46px 0 18px; border-top: 2px solid var(--ink); padding-top: 12px }
.group-head:first-child { margin-top: 0 }
.group-head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 112%; font-size: clamp(30px, 4vw, 52px); letter-spacing: -.035em; line-height: 1 }
.group-head .mono { color: var(--muted); font-size: 13px }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-flow: dense; gap: 34px 20px }
.card { grid-column: span 3; display: grid; gap: 12px; align-content: start; text-align: left; min-width: 0 }
.card[data-span] { grid-column: span var(--span) }
.ph { position: relative; overflow: hidden; background: var(--tile); aspect-ratio: 4 / 5 }
/* 各宽度的比例让同一行图片等高：3 栏 4:5，6 栏 5:3，9 栏 5:2，12 栏 10:3 */
.card[data-span="6"] .ph { aspect-ratio: 5 / 3 } .card[data-span="9"] .ph { aspect-ratio: 5 / 2 } .card[data-span="12"] .ph { aspect-ratio: 10 / 3 }
.ph img { width: 100%; height: 100%; display: block; transition: transform .6s cubic-bezier(.2, .7, .2, 1) }
.ph.cover img { object-fit: cover }
.ph.contain img { object-fit: contain; padding: 9%; mix-blend-mode: multiply }
:root[data-mode="dark"] .ph.contain { background: #dcdcd7 }
/* 抠过底的产品：直接立在色块上，加一道贴地的柔影；深色模式也保持深色底 */
.ph.contain.cut { background: var(--bg, var(--tile)) }
/* 按画框高宽定位（inset 的百分比上下取高、左右取宽），宽卡里的瘦高物件不会被压小 */
.ph.contain.cut img { position: absolute; inset: 10% 11% 9%; width: 78%; height: 81%; padding: 0; mix-blend-mode: normal; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .16)) drop-shadow(0 2px 3px rgba(0, 0, 0, .10)) }
:root[data-mode="dark"] .ph.contain.cut { background: var(--bgd, var(--tile)) }
.card:is([data-span="6"], [data-span="9"], [data-span="12"]) .ph.contain.cut img { inset: 14% 11% 12%; height: 74% }
:root[data-mode="dark"] .ph.contain.cut img { filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .55)) }
.card:hover .ph img { transform: scale(1.035) }
.ph .yr { position: absolute; left: 10px; top: 8px; font: 500 12px var(--mono); color: var(--ink); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 1px 6px }
.ph.cover .yr { color: #141414; background: rgba(251, 251, 249, .86) }
.cap { display: grid; gap: 3px; min-width: 0 }
.cap h3 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; display: flex; align-items: baseline; gap: 8px }
.cap h3 .dot { width: 7px; height: 7px; transform: translateY(-2px) }
.cap .en { font-size: 13px; color: var(--muted); font-style: italic }
.cap .by { font-size: 14px; display: flex; flex-wrap: wrap; gap: 0 4px }
.who { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; text-decoration-thickness: 1px }
.who:hover { text-decoration-color: var(--ink) }
.plain { color: var(--muted) }
@media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px } .card[data-span] { grid-column: span 1 } .card[data-span="6"], .card[data-span="9"], .card[data-span="12"] { grid-column: span 2 } .card[data-span="9"] .ph, .card[data-span="12"] .ph { aspect-ratio: 3 / 2 } .cap h3 { font-size: 16px } .cap .by { font-size: 13px } }

/* ---------- 设计师索引 ---------- */
.people-sec { padding-block: 30px 20px }
.ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 26px 16px }
.pp { display: grid; gap: 8px; text-align: left; min-width: 0 }
.pp .pic { aspect-ratio: 1; background: var(--tile); overflow: hidden; position: relative }
.pp .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) contrast(1.05); transition: filter .3s }
.pp:hover .pic img { filter: none }
.pp .pic .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 800 34px/1 var(--display); font-stretch: 120%; color: var(--muted); letter-spacing: -.04em }
.pp b { font-size: 14px; font-weight: 600; line-height: 1.3 }
.pp span { font: 11.5px var(--mono); color: var(--muted) }

/* ---------- 作品大图 ---------- */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--card) }
dialog::backdrop { background: rgba(10, 10, 10, .72) }
#lb { width: min(1280px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
.lb { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); min-height: min(760px, calc(100dvh - 24px)) }
.lb .big { background: var(--tile); display: grid; place-items: center; min-height: 340px; position: relative }
.lb .big img { width: 100%; height: 100%; max-height: calc(100dvh - 24px); object-fit: contain; display: block }
.lb .big.contain img { padding: 6%; mix-blend-mode: multiply }
:root[data-mode="dark"] .lb .big.contain { background: #dcdcd7 }
.lb .big.contain.cut { background: var(--bg, var(--tile)) }
.lb .big.contain.cut img { padding: 9%; mix-blend-mode: normal; filter: drop-shadow(0 20px 26px rgba(0, 0, 0, .18)) }
:root[data-mode="dark"] .lb .big.contain.cut { background: var(--bgd, var(--tile)) }
:root[data-mode="dark"] .lb .big.contain.cut img { filter: drop-shadow(0 20px 28px rgba(0, 0, 0, .6)) }
.lb .info { padding: 40px 36px 30px; display: grid; gap: 18px; align-content: start; overflow: auto; max-height: calc(100dvh - 24px) }
.lb .info h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 110%; font-size: clamp(30px, 3.2vw, 44px); letter-spacing: -.035em; line-height: 1.05 }
.lb .info .en { color: var(--muted); font-style: italic; margin-top: 6px }
.lb .meta { display: grid; grid-template-columns: 64px 1fr; gap: 8px 12px; border-top: 1px solid var(--rule); padding-top: 16px; font-size: 15px }
.lb .meta dt { margin: 0 } .lb .meta dd { margin: 0; min-width: 0 }
.lb .note { margin: 0; font-size: 16.5px; line-height: 1.75 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.pchip { display: inline-flex; align-items: center; gap: 9px; padding: 4px 14px 4px 4px; border: 1px solid var(--rule); border-radius: 999px; font-size: 14px; text-align: left }
.pchip:hover { border-color: var(--ink) }
.pchip img, .pchip .ini { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; background: var(--tile); display: grid; place-items: center; font: 700 11px var(--display); color: var(--muted) }
.pchip small { display: block; font: 11px var(--mono); color: var(--muted) }
.credit { font-size: 12px; color: var(--muted); margin-top: auto }
.credit a { color: var(--muted) }
.lbnav { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 8px }
.lbnav button, .x { width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--ink); font-size: 18px; display: grid; place-items: center; border: 1px solid var(--rule) }
.x { position: absolute; top: 14px; right: 14px; z-index: 2 }
@media (max-width: 820px) { .lb { grid-template-columns: 1fr; min-height: 0 } .lb .big { min-height: 0; aspect-ratio: 4 / 3 } .lb .big img { max-height: 60dvh } .lb .info { max-height: none; padding: 26px 20px 24px } }

.back { justify-self: start; font: 600 13px/1 var(--mono); letter-spacing: .02em; color: var(--muted); padding: 8px 12px 8px 0; margin: -14px 0 -6px }
.back:hover { color: var(--ink) }
@media (min-width: 821px) { .lb.lbp { grid-template-columns: minmax(0, .62fr) minmax(300px, 1fr) } }
.lb.lbp .big.portrait { background: var(--tile); overflow: hidden }
.lb.lbp .big.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; padding: 0; mix-blend-mode: normal }
.lb.lbp .big.portrait .ini { font: 800 120px/1 var(--display); font-stretch: 125%; letter-spacing: -.05em; color: var(--muted) }
.lb .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; border-block: 1px solid var(--rule); padding-block: 10px }
.lb .facts span { display: inline-flex; gap: 6px } .lb .facts .label { align-self: center }
.lb.lbp p { margin: 0; line-height: 1.75; font-size: 16px }
.lb blockquote { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; border-left: 3px solid var(--c-appliance); padding-left: 14px }
@keyframes gdFwd { from { opacity: 0; transform: translateX(14px) } }
@keyframes gdBack { from { opacity: 0; transform: translateX(-14px) } }
.lb.fwd { animation: gdFwd .22s cubic-bezier(.2,.7,.2,1) } .lb.bwd { animation: gdBack .22s cubic-bezier(.2,.7,.2,1) }
@media (max-width: 820px) { .lb.lbp .big.portrait { aspect-ratio: 4 / 3.2 } .back { margin: -6px 0 -6px } }
@media (prefers-reduced-motion: reduce) { .lb.fwd, .lb.bwd { animation: none } }
/* ---------- 人物卡（旧，保留样式） ---------- */
#pc { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(480px, 100vw); padding-top: env(safe-area-inset-top, 0px) }
.pc { display: grid; gap: 20px; padding: 0 0 40px; position: relative }
.pc .portrait { aspect-ratio: 4 / 3.4; background: var(--tile); overflow: hidden; position: relative }
.pc .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20% }
.pc .portrait .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 800 96px/1 var(--display); font-stretch: 125%; letter-spacing: -.05em; color: var(--muted) }
.pc .body { padding: 0 28px; display: grid; gap: 16px }
.pc h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 110%; font-size: 36px; letter-spacing: -.035em; line-height: 1.05 }
.pc .en { color: var(--muted); font-style: italic }
.pc .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; border-block: 1px solid var(--rule); padding-block: 10px }
.pc .facts span { display: inline-flex; gap: 6px } .pc .facts .label { align-self: center }
.pc p { margin: 0; line-height: 1.75 }
.pc blockquote { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; border-left: 3px solid var(--c-appliance); padding-left: 14px }
.works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.works button { display: grid; gap: 6px; text-align: left; min-width: 0 }
.works .ph { aspect-ratio: 1 }
.works b { font-size: 13px; font-weight: 600; line-height: 1.3 }
.works span { font: 11px var(--mono); color: var(--muted) }
#pc .x { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px }

footer { border-top: 2px solid var(--ink); margin-top: 40px; padding-block: 22px 60px; font-size: 12.5px; color: var(--muted); display: grid; gap: 12px }
footer .credits { columns: 3 300px; column-gap: 28px; line-height: 1.6 }
footer .credits div { break-inside: avoid; margin-bottom: 2px }
footer a { color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
.hide { display: none !important }
</style>
</head><body>
<div class="corner" role="group" aria-label="显示设置">
  <button class="lang" id="lang" type="button"></button><i aria-hidden="true"></i>
  <button class="theme" id="theme" type="button" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<header class="hero wrap">
  <h1 id="h1">好设计<br>两百年<small>Good Design, 1851–2026</small></h1>
  <div>
    <p class="intro" id="intro">从 1851 年伦敦的水晶宫到 2024 年的无人出租车，<b>87 件</b>建筑、家具、家电、消费电子和交通工具，以及背后的 <b>60 多位设计师</b>和几家把设计当作信仰的公司。点任意作品看大图，点设计师的名字看他的故事。</p>
    <div class="counts" id="counts"></div>
  </div>
</header>

<div class="wrap"><div class="ruler" id="ruler"><div class="track" id="track"></div></div></div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="right">
      <div class="seg" id="sort"><button data-v="cat" aria-pressed="true">按类别</button><button data-v="year" aria-pressed="false">按年代</button></div>
    </div>

  "barcelona-chair": {
   "note": "Designed for the Barcelona Pavilion; the X-shaped flat steel legs come from ancient Roman folding stools.",
   "maker": "Knoll"
  },
  "anglepoise": {
   "note": "A car engineer used spring balancing to make a lamp that stays wherever you put it. Norway's Luxo L-1 was licensed from it, and later became the model for Pixar's lamp.",
   "maker": "Anglepoise"
  },
  "stool-60": {
   "note": "Aalto invented a way to bend the end of a solid-wood leg into an L, so three legs screw straight under the seat and the stools stack.",
   "maker": "Artek"
  },
  "ph5": {
   "note": "Layers of shades are set on a logarithmic spiral so the bulb is hidden from every angle and the light stays soft and glare-free.",
   "maker": "Louis Poulsen"
  },
  "wishbone": {
   "note": "The Y-shaped back was inspired by Chinese Ming-dynasty horseshoe chairs; the seat is hand-woven from about 120 metres of paper cord.",
   "maker": "Carl Hansen & Søn"
  },
  "akari": {
   "note": "Noguchi used the Gifu lantern tradition of bamboo ribs and washi paper to make more than a hundred shapes, all of which fold flat.",
   "maker": "Ozeki & Co. (Gifu)"
  },
  "butterfly-stool": {
   "note": "Two identical pieces of bent plywood joined by one brass rod and two screws. An icon of Japanese post-war industrial design.",
   "maker": "Tendo Mokko"
  },
  "eames-lounge": {
   "note": "The Eameses wanted a chair with \"the warm, receptive look of a well-used first baseman's mitt\". Plywood shells with leather cushions, in production ever since.",
   "maker": "Herman Miller"
  },
  "tulip": {
   "note": "Saarinen wanted to clear up \"the slum of legs\" under tables and chairs, so he left a single cast-aluminium pedestal.",
   "maker": "Knoll"
  },
  "egg": {
   "note": "Designed for the SAS Royal Hotel in Copenhagen, where everything from the building to the door handles and cutlery was by Jacobsen.",
   "maker": "Fritz Hansen"
  },
  "kikkoman": {
   "note": "Red cap, two spouts, no drips. The shape reportedly took three years and more than a hundred prototypes; hundreds of millions have been sold.",
   "maker": "Kikkoman"
  },
  "arco": {
   "note": "A block of Carrara marble anchors a steel arc that reaches over the dining table, no hole in the ceiling needed. The hole in the base lets two people carry it on a broomstick.",
   "maker": "Flos"
  },
  "panton": {
   "note": "The first cantilevered plastic chair moulded in a single piece. It took almost ten years from late-1950s sketches to production.",
   "maker": "Vitra"
  },
  "tizio": {
   "note": "The arms themselves carry the current and are balanced by counterweights, so a touch positions it. It used the then-new halogen bulb.",
   "maker": "Artemide"
  },
  "juicy-salif": {
   "note": "Reportedly sketched by Starck on a napkin while eating squid. It is not much good at juicing, but it became a symbol of 1990s design.",
   "maker": "Alessi"
  },
  "kitchenaid": {
   "note": "The streamlined head has barely changed in over eighty years; today's attachments still fit a 1937 body.",
   "maker": "KitchenAid"
  },
  "lettera22": {
   "note": "A portable typewriter slim enough to slip into a briefcase, named in 1959 one of the best industrial designs of the previous hundred years."
  },
  "sk4": {
   "note": "A white steel case with a clear acrylic lid, at a time when hi-fi was all wooden furniture. It was nicknamed \"Snow White's Coffin\"."
  },
  "t4": {
   "note": "The successor to the T3: one round dial and a grid of round holes. Decades later the first iPod was often compared to this series, and the resemblance is obvious."
  },
  "ts502": {
   "note": "Closed, it is a cube; open, one half is the speaker and the other the knobs and dial, like a box that talks.",
   "maker": "Brionvega"
  },
  "valentine": {
   "note": "A red plastic typewriter launched on Valentine's Day, with a case you can carry. Sottsass wanted the typewriter to be an \"anti-machine\", an everyday toy."
  },
  "beogram4000": {
   "note": "B&O's tangential turntable: the arm travels in a straight line, always tangent to the groove. One slab of brushed aluminium with just a few keys."
  },
  "et66": {
   "note": "Domed round keys colour-coded by function. The early iPhone calculator app was all but traced from it."
  },
  "dc01": {
   "note": "Dyson built 5,127 prototypes to get bagless cyclonic separation right. The clear bin lets you see the dust it picks up.",
   "maker": "Dyson"
  },
  "muji-cd": {
   "note": "Pull the hanging cord and it starts playing; it looks like a bathroom extractor fan. Naoto Fukasawa calls it \"design without thought\".",
   "maker": "MUJI"
  },
  "leica-m3": {
   "note": "It merged rangefinder, viewfinder and parallax correction into one bright window, and lenses change with a twist. Half a century on, the digital M cameras still look like it.",
   "maker": "Leitz"
  },
  "tr610": {
   "note": "A pocket radio that fits in one hand. It sold half a million units and carried the Sony name beyond Japan."
  },
  "sx70": {
   "note": "An SLR that folds flat into a slim box; the picture slides out by itself and develops in your hand.",
   "maker": "Polaroid"
  },
  "apple2": {
   "note": "One of the first personal computers in a plastic case, ready to use out of the box. Jobs insisted on a beige case like a kitchen appliance: no metal box, no fan."
  },
  "walkman": {
   "note": "Recording was dropped and lightweight headphones added, so music could go with you for the first time. It had two headphone jacks and a \"hotline\" talk button."
  },
  "famicom": {
   "note": "Red and white, with two controllers docked in slots on the sides. It brought video games into Japanese living rooms and revived the American games industry after its crash.",
   "maker": "Nintendo"
  },
  "mac128k": {
   "note": "An all-in-one, upright case whose front reads like a face. The signatures of the whole Mac team are moulded inside the case."
  },
  "discman": {
   "note": "About the size of four stacked CD cases, far smaller and much cheaper than the home CD players of the day. The portable CD starts here."
  },
  "gameboy": {
   "note": "Gunpei Yokoi's \"lateral thinking with withered technology\": a monochrome screen, low power and thirty hours on four AA batteries. Over a hundred million sold.",
   "maker": "Nintendo"
  },
  "playstation": {
   "note": "A pale-grey body with a round disc lid. The ○ × △ □ symbols on the controller are Goto's too, and thirty years later they are still there."
  },
  "thinkpad701c": {
   "note": "The \"butterfly\" keyboard splits in two to fit the small body when closed, and slides apart into a full-size keyboard when opened. Sapper's black box with a red dot has barely changed in thirty years.",
   "maker": "IBM"
  },
  "palmpilot": {
   "note": "Hawkins carried a wooden model in his shirt pocket and pretended to use it for months to get the size right. Graffiti handwriting made handheld computers truly usable for the first time.",
   "maker": "Palm"
  },
  "imac-g3": {
   "note": "A translucent Bondi Blue shell with a handle on top made a computer feel like a household object for the first time. It pulled Apple back from the brink of bankruptcy."
  },
  "ipod": {
   "note": "\"1,000 songs in your pocket.\" A mechanical scroll wheel and white earbuds, and white became Apple's colour."
  },
  "imac-g4": {
   "note": "A domed base and a stainless-steel arm let one finger push the screen to any angle, as if it were floating. Jobs said it was inspired by a sunflower in the garden."
  },
  "iphone": {
   "note": "The keyboard is gone; the whole glass face is the interface. It redefined every phone that came after it."
  },
  "op1": {
   "note": "A portable synthesiser the size of an aluminium plate. Four coloured knobs match four colours of parameters on screen: half toy, half instrument.",
   "maker": "Teenage Engineering"
  },
  "nest": {
   "note": "The dullest box on the wall became a turning stainless-steel ring. It learns the household's routine and sets the temperature by itself.",
   "maker": "Nest"
  },
  "applewatch": {
   "note": "A rounded-rectangle case, a turning Digital Crown and bands that swap with one press. It turned the watch into a screen on the wrist; ten years on it is the best-selling watch in the world."
  },
  "airpods": {
   "note": "No cable, and they connect as soon as you open the lid. Mocked as electric toothbrush heads at launch, within a few years they were the best-selling headphones in the world."
  },
  "nothing-phone": {
   "note": "A transparent back that shows the wireless charging coil and the screws, and a Glyph of more than nine hundred LEDs that turns calls and notifications into light. Among a decade of identical glass slabs, it is the first phone that makes people turn it over."
  },
  "modelt": {
   "note": "The first car born for the assembly line. Fifteen million were built in nineteen years as the price fell from $850 to $260. The design had one aim: cheap, tough and fixable by anyone.",
   "maker": "Ford"
  },
  "beetle": {
   "note": "An air-cooled rear engine and a rounded body; for sixty-five years only the details changed. 21 million were sold, more than any single car design.",
   "maker": "Volkswagen"
  },
  "vespa": {
   "note": "Barred from building aircraft after the war, Piaggio built this scooter. The steel body encloses the engine so no oil reaches your trousers, and Italy took to the streets on it.",
   "maker": "Piaggio"
  },
  "ds": {
   "note": "Twelve thousand orders on the first day of the Paris Motor Show. Hydropneumatic suspension let the body float over the road, and the tapering tail still looked like the future twenty years later. Roland Barthes said it seemed to have fallen from the sky.",
   "maker": "Citroën"
  },
  "fiat500": {
   "note": "Under three metres long, with an air-cooled twin and a canvas roof, yet it carried a family of four. Post-war Italy learned to drive in it, and the new 500 of fifty years later still looks the same.",
   "maker": "Fiat"
  },
  "mini": {
   "note": "Transverse engine, front-wheel drive and wheels pushed to the corners leave 80% of the length for people. The layout became the standard for almost every small car.",
   "maker": "BMC"
  },
  "etype": {
   "note": "An overnight sensation at the Geneva Motor Show. The long bonnet was shaped by aerodynamics; top speed 240 km/h at half the price of a Ferrari. Enzo Ferrari called it \"the most beautiful car ever made\".",
   "maker": "Jaguar"
  },
  "p911": {
   "note": "An air-cooled flat-six in the tail and a fastback roofline drawn in one stroke. Sixty years and eight generations, with lights and silhouette barely changed: the longest-running shape in car history.",
   "maker": "Porsche"
  },
  "shinkansen": {
   "note": "Opened nine days before the Tokyo Olympics at 210 km/h, the world's first high-speed railway. The round nose looks like an aircraft, or a bullet, hence the name \"bullet train\".",
   "maker": "Japanese National Railways"
  },
  "concorde": {
   "note": "Twice the speed of sound, London to New York in three and a half hours. The delta wing and the nose that droops for take-off and landing make it look airborne even on the ground. Since it retired in 2003, airliners have not gone supersonic again.",
   "maker": "Aérospatiale / BAC"
  },
  "countach": {
   "note": "A wedge body, scissor doors and a windscreen that almost lies flat. It defined what \"supercar\" would look like for half a century and hung on countless teenagers' bedroom walls.",
   "maker": "Lamborghini"
  },
  "roadster": {
   "note": "Built on a modified Lotus Elise chassis, with a pack of more than six thousand laptop cells and a 390 km range. It proved an electric car could be a sports car people wanted, not a compromise."
  },
  "falcon9": {
   "note": "In December 2015 a first stage came back and landed upright after launch. Until then every rocket had been thrown away. Reuse cut launch costs to a fraction and changed the arithmetic of spaceflight."
  },
  "model3": {
   "note": "No instrument cluster, no extra buttons; one landscape screen is the whole interface. The first electric car to sell in the millions, it made minimalist interiors the industry's new direction."
  },
  "cybertruck": {
   "note": "Stainless-steel panels cannot be stamped into curves, so the whole truck is straight lines and folds, like folded paper. Fans call it the boldest production vehicle in a century; critics say it should never be on the road."
  },
  "cybercab": {
   "note": "Two seats, butterfly doors, no steering wheel and no pedals. Designed from the start without a driver, its cabin is a small lounge and its body a rounded-off Cybertruck."
  }
 },
 "people": {
  "paxton": {
   "from": "UK",
   "role": "Gardener, architect",
   "bio": "Trained as a gardener, he built giant glasshouses for a duke's estate and took structural ideas from the veins of a water-lily leaf. The Crystal Palace turned him from gardener into a Victorian architectural hero."
  },
  "eiffel": {
   "from": "France",
   "role": "Structural engineer",
   "bio": "Famous for iron bridges, he also designed the internal iron frame of the Statue of Liberty. The tower was first proposed by engineers in his firm; he bought the patent and saw it built."
  },
  "rietveld": {
   "from": "Netherlands",
   "role": "Furniture designer, architect",
   "bio": "A cabinetmaker by training and a core member of De Stijl. He turned Mondrian's flat compositions into three-dimensional things you could sit on and live in."
  },
  "gropius": {
   "from": "Germany → USA",
   "role": "Architect, educator",
   "bio": "Founded the Bauhaus in 1919 to unite art, craft and industry. He later taught at Harvard and brought modernism to America."
  },
  "mies": {
   "from": "Germany → USA",
   "role": "Architect",
   "bio": "The last director of the Bauhaus, he moved to Chicago before the war. Steel, glass and exact proportion were his whole vocabulary.",
   "quote": "Less is more."
  },
  "corbusier": {
   "from": "Switzerland → France",
   "role": "Architect, urban planner",
   "bio": "The most influential figure in modern architecture, author of the Five Points and the Modulor proportion system. From the white box of the Villa Savoye to the sculptural Ronchamp chapel, almost every phase of his work rewrote architecture.",
   "quote": "A house is a machine for living in."
  },
  "wright": {
   "from": "USA",
   "role": "Architect",
   "bio": "Champion of \"organic architecture\", buildings at one with their site and nature. His career spanned seventy years and more than a thousand designs."
  },
  "aalto": {
   "from": "Finland",
   "role": "Architect, designer",
   "bio": "He joined modernist rigour with Nordic timber and daylight, a \"humane modernism\". With his wife Aino he founded the furniture company Artek."
  },
  "pjohnson": {
   "from": "USA",
   "role": "Architect, curator",
   "bio": "His 1932 \"International Style\" show at MoMA introduced European modernism to America. He won the first Pritzker Prize in 1979 and later turned to postmodernism."
  },
  "kahn": {
   "from": "USA",
   "role": "Architect",
   "bio": "A late bloomer whose major works came in his fifties. He asked \"what does a brick want to be?\" and made almost sacred spaces from concrete, brick and light."
  },
  "utzon": {
   "from": "Denmark",
   "role": "Architect",
   "bio": "At 38 he won the Sydney Opera House competition with a set of sketches, then left mid-way over budgets and politics. Pritzker Prize 2003."
  },
  "piano": {
   "from": "Italy",
   "role": "Architect",
   "bio": "He was in his thirties when he designed the Pompidou with Rogers, and has since been known for light, precise construction. Pritzker Prize 1998."
  },
  "rogers": {
   "from": "UK",
   "role": "Architect",
   "bio": "A leading figure of High-Tech, also known for the Lloyd's building and the Millennium Dome in London. Pritzker Prize 2007."
  },
  "ando": {
   "from": "Japan",
   "role": "Architect",
   "bio": "A former professional boxer with no formal architectural training, he taught himself by reading and travelling. Fair-faced concrete and light are his signature. Pritzker Prize 1995."
  },
  "pei": {
   "from": "China → USA",
   "role": "Architect",
   "bio": "Born in Guangzhou, he studied under Gropius at Harvard. His works include the Louvre Pyramid, the Bank of China Tower in Hong Kong and the Suzhou Museum. Pritzker Prize 1983."
  },
  "gehry": {
   "from": "Canada → USA",
   "role": "Architect",
   "bio": "Starting with his own house, he challenged architecture's rules with chain-link and corrugated metal, and was among the first to design complex curved buildings with aerospace software. Pritzker Prize 1989; he died at home in Los Angeles in 2025."
  },
  "foster": {
   "from": "UK",
   "role": "Architect",
   "bio": "The other great name of High-Tech: HSBC's Hong Kong headquarters, Beijing Capital Airport T3 and London's \"Gherkin\". Pritzker Prize 1999."
  },
  "thonet": {
   "from": "Germany → Austria",
   "role": "Furniture maker",
   "bio": "He invented large-scale steam bending and founded Gebrüder Thonet in Vienna, a pioneer of industrially mass-produced furniture."
  },
  "breuer": {
   "from": "Hungary → USA",
   "role": "Furniture designer, architect",
   "bio": "A Bauhaus student who went on to run its furniture workshop. In America he turned to architecture and designed the original Whitney Museum in New York."
  },
  "perriand": {
   "from": "France",
   "role": "Furniture designer, architect",
   "bio": "She joined Le Corbusier's studio at 24 and led its tubular-steel furniture. Working in Japan in the 1940s, she brought Eastern craft into modern design."
  },
  "carwardine": {
   "from": "UK",
   "role": "Automotive engineer",
   "bio": "A specialist in vehicle suspension springs, he used the same principle to make a lamp that holds any position, and licensed it to Herbert Terry & Sons."
  },
  "henningsen": {
   "from": "Denmark",
   "role": "Designer, writer",
   "bio": "He spent his life working out how to take the glare out of electric light. His collaboration with Louis Poulsen, begun in the 1920s, continues today."
  },
  "wegner": {
   "from": "Denmark",
   "role": "Furniture designer",
   "bio": "A cabinetmaker who designed more than five hundred chairs, \"the master of the chair\". Kennedy and Nixon sat in his The Chair for their 1960 TV debate."
  },
  "noguchi": {
   "from": "USA / Japan",
   "role": "Sculptor, designer",
   "bio": "A Japanese-American sculptor whose work spanned sculpture, gardens, stage sets and furniture. He kept developing Akari for over thirty years."
  },
  "yanagi": {
   "from": "Japan",
   "role": "Industrial designer",
   "bio": "Son of Soetsu Yanagi, founder of the mingei folk-craft movement, he assisted Perriand in Japan. His stainless kitchenware and cutlery are still everyday items in Japanese homes."
  },
  "eames": {
   "from": "USA",
   "role": "Designer couple",
   "bio": "From plywood splints and fibreglass chairs to the film Powers of Ten, Charles and Ray Eames all but redefined the post-war American home.",
   "quote": "The details are not the details. They make the design."
  },
  "saarinen": {
   "from": "Finland → USA",
   "role": "Architect, designer",
   "bio": "Son of the Finnish architect Eliel Saarinen. His buildings include the Gateway Arch in St. Louis and the TWA Flight Center at JFK. He died at 51."
  },
  "jacobsen": {
   "from": "Denmark",
   "role": "Architect, designer",
   "bio": "A believer in total design, he designed everything from buildings to lamps, cutlery and door handles. The Ant, Series 7, Egg and Swan chairs are all his."
  },
  "ekuan": {
   "from": "Japan",
   "role": "Industrial designer",
   "bio": "Founder of GK Design Group, whose work ranges from soy-sauce bottles to motorcycles and Shinkansen trains. His thinking was deeply shaped by Buddhism."
  },
  "castiglioni": {
   "from": "Italy",
   "role": "Designer",
   "bio": "With his brother Pier Giacomo he designed many lamps and pieces of furniture, often by repurposing ready-made objects, such as a stool made from a tractor seat."
  },
  "panton": {
   "from": "Denmark",
   "role": "Designer",
   "bio": "He worked for Arne Jacobsen, then challenged Scandinavian restraint with plastics, strong colour and whole-room installations."
  },
  "sapper": {
   "from": "Germany → Italy",
   "role": "Industrial designer",
   "bio": "He spent most of his life working in Milan and was IBM's chief design consultant for many years, shaping the look of the ThinkPad."
  },
  "starck": {
   "from": "France",
   "role": "Designer",
   "bio": "He has designed everything from toothbrushes and chairs to hotels and yachts, the best-known \"star designer\" of the 1990s."
  },
  "arens": {
   "from": "USA",
   "role": "Industrial designer",
   "bio": "A designer of America's streamline era and an early student of consumer psychology, who coined the term \"consumer engineering\"."
  },
  "nizzoli": {
   "from": "Italy",
   "role": "Industrial designer",
   "bio": "He moved from poster design to industrial design and long designed Olivetti's typewriters and calculators, setting the elegant tone of Italian industrial design."
  },
  "rams": {
   "from": "Germany",
   "role": "Industrial designer",
   "bio": "He joined Braun in 1955 and was head of design from 1961 to 1995. His \"ten principles of good design\" influenced generations of designers, Apple's included.",
   "quote": "Weniger, aber besser. (Less, but better.)"
  },
  "gugelot": {
   "from": "Netherlands → Germany",
   "role": "Industrial designer",
   "bio": "A core teacher at the Ulm School of Design, who with his students built a systematic, modular design method for Braun."
  },
  "zanuso": {
   "from": "Italy",
   "role": "Architect, designer",
   "bio": "One of the founders of post-war Italian design. He created a series of Brionvega products with Sapper and was among the first to make furniture from foam rubber and other new materials."
  },
  "sottsass": {
   "from": "Italy",
   "role": "Designer, architect",
   "bio": "He designed Olivetti typewriters and computers for years, then in 1981 founded the Memphis Group, whose bright colours and anti-functionalist forms shook the design world."
  },
  "jjensen": {
   "from": "Denmark",
   "role": "Industrial designer",
   "bio": "Chief designer for Bang & Olufsen for nearly thirty years from 1964, he set B&O's thin, precise aluminium-panel style."
  },
  "lubs": {
   "from": "Germany",
   "role": "Industrial designer",
   "bio": "Rams's long-time partner at Braun, who led its calculators and clocks."
  },
  "dyson": {
   "from": "UK",
   "role": "Inventor, entrepreneur",
   "bio": "Fed up with vacuum bags that lost suction as they filled, he spent five years making a bagless cyclonic cleaner, then grew his company into a technology firm spanning motors, hair dryers and batteries."
  },
  "fukasawa": {
   "from": "Japan",
   "role": "Industrial designer",
   "bio": "Known for \"without thought\" design, finding answers in people's unconscious gestures. A long-time designer for MUJI and founder of the ±0 brand."
  },
  "land": {
   "from": "USA",
   "role": "Inventor, entrepreneur",
   "bio": "Founder of Polaroid and inventor of polarising film and instant photography. Steve Jobs idolised him and called him \"a national treasure\"."
  },
  "dreyfuss": {
   "from": "USA",
   "role": "Industrial designer",
   "bio": "A founder of American industrial design, renowned for his human-factors research. Bell telephones, John Deere tractors and Polaroid cameras all came from his office."
  },
  "manock": {
   "from": "USA",
   "role": "Industrial designer",
   "bio": "Apple's early industrial designer, who designed the Apple II and Apple III cases and, with Terry Oyama, the first Macintosh."
  },
  "yokoi": {
   "from": "Japan",
   "role": "Game hardware designer",
   "bio": "Nintendo's legendary engineer, inventor of Game & Watch, the D-pad and the Game Boy. His \"lateral thinking with withered technology\" meant new kinds of play from mature, cheap technology."
  },
  "ive": {
   "from": "UK",
   "role": "Industrial designer",
   "bio": "He joined Apple in 1992 and led the design of everything from the iMac to the iPhone, Apple Watch and Apple Park. He left in 2019 and founded LoveFrom."
  },
  "fadell": {
   "from": "USA",
   "role": "Engineer, entrepreneur",
   "bio": "He led the team that built the iPod, earning the title \"father of the iPod\". After Apple he founded Nest, sold to Google in 2014 for $3.2 billion."
  },
  "jobs": {
   "from": "USA",
   "role": "Co-founder of Apple",
   "bio": "He never drew a design, yet signed off every product down to the details. He brought the design thinking of Braun, Sony and the Bauhaus into personal computing."
  },
  "morita": {
   "from": "Japan",
   "role": "Co-founder of Sony",
   "bio": "Co-founded Sony with Masaru Ibuka and personally pushed the pocket radio and the Walkman into being, turning \"Made in Japan\" from a byword for cheap into a mark of quality."
  },
  "hford": {
   "from": "USA",
   "role": "Industrialist, engineer",
   "bio": "He launched the Model T in 1908 and the moving assembly line in 1913, cutting assembly time from twelve hours to about ninety minutes and turning the car from a luxury into something ordinary people could afford.",
   "quote": "Any customer can have a car painted any colour that he wants so long as it is black."
  },
  "fporsche": {
   "from": "Austria → Germany",
   "role": "Automotive engineer",
   "bio": "He founded his own design office in 1931 and was commissioned to design a \"people's car\" for Germany, the future Beetle. His son Ferry founded the Porsche brand; his grandson designed the 911."
  },
  "dascanio": {
   "from": "Italy",
   "role": "Aeronautical engineer",
   "bio": "A helicopter pioneer who reportedly disliked motorcycles. He designed the Vespa like an aircraft: a single-sided arm for easy wheel changes, and a steel body and floorboard so you could ride it in a skirt."
  },
  "bertoni": {
   "from": "Italy → France",
   "role": "Sculptor, car designer",
   "bio": "He joined Citroën as a sculptor and shaped the Traction Avant, 2CV and DS. The DS body was modelled by hand in clay, not drawn."
  },
  "giacosa": {
   "from": "Italy",
   "role": "Automotive engineer",
   "bio": "Head of Fiat design for almost forty years: the Topolino, 500, 600 and 128 are all his. He believed a small car starts with space and cost, and only then shape."
  },
  "issigonis": {
   "from": "Greece → UK",
   "role": "Automotive engineer",
   "bio": "Asked to design a frugal small car during the fuel shortage after the Suez Crisis, he turned the engine sideways, put the gearbox in the sump and pushed the wheels to the corners, fitting four adults into a three-metre car.",
   "quote": "A camel is a horse designed by committee."
  },
  "sayer": {
   "from": "UK",
   "role": "Aerodynamicist",
   "bio": "He built aircraft at Bristol during the war, then joined Jaguar and drew bodies with mathematics and wind tunnels rather than sketches. The D-Type, E-Type and XJ13 are curves he calculated."
  },
  "fabporsche": {
   "from": "Germany",
   "role": "Industrial designer",
   "bio": "Ferdinand Porsche's grandson, known as Butzi. He designed the 911's body in 1963, then left in 1972 to found Porsche Design, making watches, glasses and pipes."
  },
  "miki": {
   "from": "Japan",
   "role": "Aeronautical engineer",
   "bio": "He designed bombers for the navy in the war, then moved to the Railway Technical Research Institute. He brought aircraft streamlining and lightness to trains; the round nose of the 0 Series Shinkansen is his."
  },
  "gandini": {
   "from": "Italy",
   "role": "Car designer",
   "bio": "In fourteen years at Bertone he designed the Miura, Countach and Stratos, and invented the Countach's scissor doors. With him the wedge became the standard language of the supercar."
  },
  "musk": {
   "from": "South Africa → USA",
   "role": "Entrepreneur",
   "bio": "He founded SpaceX in 2002 and invested in Tesla in 2004, becoming its chairman. Both companies set out to do what others thought impossible: make electric cars more desirable than petrol ones, and make rockets reusable like aircraft."
  },
  "holzhausen": {
   "from": "USA",
   "role": "Car designer",
   "bio": "After working on VW's New Beetle and Mazda concept cars, he joined Tesla as chief designer in 2008. The Model S, 3, X, Y and Cybertruck all came from his team."
  }
 },
 "makers": {
  "braun": {
   "from": "Germany · 1921",
   "bio": "In the 1950s, under the brothers Erwin and Artur Braun, the company worked with the Ulm School of Design; over Dieter Rams's three decades as head of design, Braun became a byword for rational design."
  },
  "sony": {
   "from": "Japan · 1946",
   "bio": "Founded by Masaru Ibuka and Akio Morita in a Tokyo department store after the war. From transistor radios and Trinitron TVs to the Walkman, Sony defined \"portable\" and \"miniature\"."
  },
  "nothing": {
   "from": "UK · 2020",
   "bio": "Founded in London by Carl Pei; its transparent design language was set early on with Teenage Engineering. From Ear (1) to Phone (1), it set out to prove the phone industry still had room for a new brand, and that design could be what people remember it for."
  },
  "apple": {
   "from": "USA · 1976",
   "bio": "Jobs said Apple stood at the intersection of technology and the liberal arts. From the Macintosh to the iPhone, design there matters as much as engineering."
  },
  "olivetti": {
   "from": "Italy · 1908",
   "bio": "Under Adriano Olivetti it treated design, architecture and corporate culture as one, hiring designers such as Nizzoli and Sottsass, one of the most design-minded companies of the 20th century."
  },
  "bo": {
   "from": "Denmark · 1925",
   "bio": "Known for aluminium, minimal panels and unusual engineering, with long collaborations with designers such as Jacob Jensen and David Lewis."
  },
  "tesla": {
   "from": "USA · 2003",
   "bio": "It started with a sports car to prove electric could beat petrol, then made it affordable with the Model 3. Its interiors, over-the-air updates and direct sales have been copied across the industry."
  },
  "spacex": {
   "from": "USA · 2002",
   "bio": "Its goal is cheaper access to space. The Falcon 9 first stage lands and flies again, some boosters more than twenty times, cutting the cost per kilogram to orbit to a fraction of what it was."
  }
 },

  return `<div class="ph ${fit}${extra}"${tint}>${img}<span class="yr">${it.y}</span></div>`;
}
// 每组按 12 栏装行：重点作品占 6 栏、其余 3 栏，最后一行不满时把末尾几件拉宽补齐
function spans(list) {
  const out = [], row = [];
  let used = 0;
  const flush = () => { let left = 12 - used; for (let i = row.length - 1; left > 0 && i >= 0; i--, left -= 3) out[row[i]] += 3; if (left > 0 && row.length) out[row.at(-1)] += left; row.length = 0; used = 0; };
  list.forEach((it, i) => {
    let s = FEATURE[it.id] ? 6 : 3;
    if (used + s > 12) { if (s === 6 && used === 9) s = 3; else flush(); }
    out[i] = s; row.push(i); used += s; if (used === 12) { row.length = 0; used = 0; }
  });
  // 最后一行只剩一件时会被拉成整行宽、主体显得很小：把上一行的 6 栏大图降成 3 栏，让它并进上一行
  if (row.length === 1 && used === 3) {
    const prev = [];
    for (let i = row[0] - 1, sum = 0; i >= 0 && sum < 12; i--) { sum += out[i]; prev.unshift(i); }
    const big = prev.find(i => out[i] === 6);
    if (big !== undefined && prev.reduce((a, i) => a + out[i], 0) === 12) { out[big] = 3; row.length = 0; used = 0; }
  }
  if (used) flush();
  return out;
}
function cards(list) { const s = spans(list); return list.map((it, i) => card(it, s[i])).join(''); }
function card(it, span = 3) {
  return `<article class="card" data-span="${span}" style="--span:${span}" data-id="${it.id}">
    <button class="open" data-open="${it.id}" aria-label="${L().view} ${esc(nm(it))}">${photo(it, '', span)}</button>
    <div class="cap"><h3><i class="dot ${it.cat}"></i>${esc(nm(it))}</h3>${isEn() ? '' : `<div class="en">${esc(it.en)}</div>`}<div class="by">${byLine(it)}</div></div></article>`;
}

function renderCounts() {
  document.getElementById('counts').innerHTML = CATS.map(c => `<span><i class="dot ${c.k}"></i>${catName(c)}<b>${ITEMS.filter(i => i.cat === c.k).length}</b></span>`).join('');
}
function renderTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = `<button class="tab" data-v="" aria-pressed="true">${L().all}<sup>${ITEMS.length}</sup></button>` +
    CATS.map(c => `<button class="tab" data-v="${c.k}" aria-pressed="false"><i class="dot ${c.k}"></i>${catName(c)}<sup>${ITEMS.filter(i => i.cat === c.k).length}</sup></button>`).join('');
  box.onclick = e => { const b = e.target.closest('.tab'); if (!b) return; state.cat = b.dataset.v || null; render(); };
  document.getElementById('sort').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.sort = b.dataset.v; render(); };
}
function renderRuler() {
  const X0 = 1845, X1 = 2030, pct = y => ((y - X0) / (X1 - X0) * 100) + '%';
  const tr = document.getElementById('track'); let h = '';
  for (let y = 1850; y <= 2025; y += 25) h += `<i class="tick" style="left:${pct(y)}"><span>${y}</span></i>`;
  // 按像素距离往上堆：每个点落到第一条"左边最近的点离它 ≥14px"的泳道；泳道数决定轨道高度，点永远不会顶出横线
  const W = tr.clientWidth || 1200, px = y => (y - X0) / (X1 - X0) * W, lanes = [];
  const pts = [...ITEMS].sort((a, b) => a.y - b.y || a.id.localeCompare(b.id)).map(it => {
    const x = px(it.y); let l = lanes.findIndex(v => x - v >= 14);
    if (l < 0) { l = lanes.length; lanes.push(x); } else lanes[l] = x;
    return { it, l };
  });
  const H = Math.max(92, lanes.length * 15 + 12); tr.style.height = H + 'px';
  pts.forEach(({ it, l }) => {
    h += `<button class="pt" data-open="${it.id}" data-cat="${it.cat}" style="left:${pct(it.y)};top:${H - 12 - l * 15}px;background:var(--c-${it.cat})" aria-label="${it.y} ${esc(nm(it))}"></button>`;
  });
  tr.innerHTML = h + '<span class="tip" id="tip" hidden></span>';
  tr.querySelectorAll('.pt').forEach(p => p.classList.toggle('off', !!state.cat && p.dataset.cat !== state.cat));
  const tip = document.getElementById('tip');
  tr.onpointerover = e => { const p = e.target.closest('.pt'); if (!p) return; const it = byId[p.dataset.open];
    tip.textContent = `${it.y} · ${nm(it)}`; tip.style.left = p.style.left; tip.style.top = (parseFloat(p.style.top) - 34) + 'px'; tip.hidden = false; };
  tr.onpointerout = () => tip.hidden = true;
}
{ let rw = innerWidth; addEventListener('resize', () => { if (innerWidth !== rw) { rw = innerWidth; renderRuler(); } }); }
function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v || null) === state.cat)));
  document.querySelectorAll('#sort button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.sort)));
  document.querySelectorAll('.ruler .pt').forEach(p => p.classList.toggle('off', !!state.cat && p.dataset.cat !== state.cat));
  const list = ITEMS.filter(i => !state.cat || i.cat === state.cat);
  let h = '';
  if (state.sort === 'cat') {
    for (const c of CATS) {
      const g = list.filter(i => i.cat === c.k).sort((a, b) => a.y - b.y); if (!g.length) continue;
      h += `<div class="group-head"><h2>${catName(c)}</h2><span class="mono">${isEn() ? '' : c.en + ' · '}${g[0].y}–${g.at(-1).y} · ${g.length}</span></div><div class="grid">${cards(g)}</div>`;
    }
  } else {
    const decades = {};
    [...list].sort((a, b) => a.y - b.y).forEach(i => { const d = i.y < 1900 ? L().c19 : `${Math.floor(i.y / 10) * 10}s`; (decades[d] ||= []).push(i); });
    for (const [d, g] of Object.entries(decades)) h += `<div class="group-head"><h2>${d}</h2><span class="mono">${L().pieces(g.length)}</span></div><div class="grid">${cards(g)}</div>`;
  }
  document.getElementById('main').innerHTML = h;
}
function renderPeople() {
  const ids = Object.keys(PEOPLE).filter(id => worksOf(id).length).sort((a, b) => worksOf(a)[0].y - worksOf(b)[0].y);
  document.getElementById('pcount').textContent = L().pcount(ids.length);
  document.getElementById('ppl').innerHTML = ids.map(id => { const p = PEOPLE[id], pi = PIMG[id];
    return `<button class="pp" data-person="${id}"><div class="pic">${pi ? `<img src="${pi.s}" alt="" loading="lazy">` : `<span class="ini">${ini(p.en)}</span>`}</div><b>${esc(nm(p))}</b><span>${esc(p.life)}</span></button>`; }).join('');
}
function renderCredits() {
  const rows = [];
  ITEMS.forEach(it => { const c = IMG[it.id]; if (c) rows.push([nm(it), c]); });
  Object.entries(PEOPLE).forEach(([id, p]) => { const c = PIMG[id]; if (c) rows.push([nm(p), c]); });
  document.getElementById('credits').innerHTML = rows.map(([n, c]) => `<div>${esc(n)}${L().colon}${esc(c.artist || L().anon)}${L().comma}<a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.license)}</a></div>`).join('');
}

// ---------- 作品大图 ----------
let cur = null, curP = null;
const warmed = new Set();
function warm(id) { const im = IMG[id]; if (!im || warmed.has(id)) return; warmed.add(id); const i = new Image(); i.src = im.src; }
document.addEventListener('pointerover', e => { const b = e.target.closest('[data-open]'); if (b) warm(b.dataset.open); });
document.addEventListener('focusin', e => { const b = e.target.closest('[data-open]'); if (b) warm(b.dataset.open); });
function itemHTML(id) {
  const it = byId[id]; cur = id; { const l = [...document.querySelectorAll('#main .card')].map(c => c.dataset.id), k = l.indexOf(id); if (k >= 0) { warm(l[(k + 1) % l.length]); warm(l[(k - 1 + l.length) % l.length]); } } const im = IMG[id], c = CATS.find(c => c.k === it.cat);
  const people = it.by.filter(b => typeof b === 'string' && PEOPLE[b]);
  return `
    <div class="big ${(it.cat === 'arch' || it.fit === 'cover') ? 'cover' : im && im.cut ? 'contain cut' : 'contain'}"${im && im.bg ? ` style="--bg:${im.bg};--bgd:${im.bgd}"` : ''}>${im ? `<img src="${im.src}" alt="${esc(nm(it))}">` : ''}
      <div class="lbnav"><button data-step="-1" aria-label="${L().prev}">←</button><button data-step="1" aria-label="${L().next}">→</button></div></div>
    <div class="info"><button class="x" data-close aria-label="${L().close}">×</button>${backBtn()}
      <div class="label"><i class="dot ${it.cat}"></i> ${isEn() ? c.en : `${c.zh} · ${c.en}`}</div>
      <div><h2>${esc(nm(it))}</h2>${isEn() ? '' : `<div class="en">${esc(it.en)}</div>`}</div>
      <dl class="meta"><dt class="label">${L().year}</dt><dd class="mono">${it.y}</dd><dt class="label">${L().design}</dt><dd>${byLine(it)}</dd><dt class="label">${it.cat === 'arch' ? L().owner : L().maker}</dt><dd>${makerLine(it)}</dd></dl>
      <p class="note">${esc(tx(it, 'note', 'items', it.id))}</p>
      ${people.length ? `<div class="chips">${people.map(pid => { const p = PEOPLE[pid], pi = PIMG[pid];
        return `<button class="pchip" data-person="${pid}">${pi ? `<img src="${pi.s}" alt="">` : `<span class="ini">${ini(p.en)}</span>`}<span>${esc(nm(p))}<small>${esc(p.life)}</small></span></button>`; }).join('')}</div>` : ''}
      ${im ? `<div class="credit">${L().img}${L().colon}${esc(im.artist || L().anon)}${L().comma}<a href="${esc(im.page)}" target="_blank" rel="noopener">${esc(im.license)}</a></div>` : ''}
    </div>`;
}
function step(n) {
  const list = [...document.querySelectorAll('#main .card')].map(c => c.dataset.id);
  const i = list.indexOf(cur); if (i < 0 || !stack.length || stack.at(-1).t !== 'i') return; stack.at(-1).id = list[(i + n + list.length) % list.length]; show(0);
}

// ---------- 人物卡 ----------
function personHTML(pid, isMaker) {
  const p = isMaker ? MAKERS[pid] : PEOPLE[pid]; curP = [pid, isMaker];
  const kind = isMaker ? 'makers' : 'people', f = k => esc(tx(p, k, kind, pid));
  const pi = isMaker ? null : PIMG[pid];
  const works = isMaker ? ITEMS.filter(i => i.maker === pid).sort((a, b) => a.y - b.y) : worksOf(pid);
  return `<div class="big portrait">${pi ? `<img src="${pi.src}" alt="${esc(nm(p))}">` : `<span class="ini">${ini(p.en)}</span>`}</div>
    <div class="info"><button class="x" data-close aria-label="${L().close}">×</button>${backBtn()}
      <div><h2>${esc(nm(p))}</h2>${isEn() && p.en !== p.zh ? `<div class="en">${esc(p.zh)}</div>` : isEn() ? '' : `<div class="en">${esc(p.en)}</div>`}</div>
      <div class="facts">${isMaker ? `<span><span class="label">${L().founded}</span>${f('from')}</span>` :
        `<span><span class="label">${L().life}</span><span class="mono">${esc(p.life)}</span></span><span><span class="label">${L().from}</span>${f('from')}</span><span><span class="label">${L().role}</span>${f('role')}</span>`}</div>
      <p>${f('bio')}</p>
      ${p.quote ? `<blockquote>${f('quote')}</blockquote>` : ''}
      <div class="label">${L().works} · ${works.length}</div>
      <div class="works">${works.map(w => `<button data-open="${w.id}">${photo(w)}<b>${esc(nm(w))}</b><span>${w.y}</span></button>`).join('')}</div>
      ${pi ? `<div class="credit">${L().photo}${L().colon}${esc(pi.artist || L().anon)}${L().comma}<a href="${esc(pi.page)}" target="_blank" rel="noopener">${esc(pi.license)}</a></div>` : ''}
    </div>`;
}

// ---------- 同一卡片内的导航栈：作品 ⇄ 人物，返回键 / Esc / 系统返回先出栈再关闭 ----------
const stack = [], LBD = document.getElementById('lb'), LBB = document.getElementById('lbBody');
let skipPop = 0;
function backBtn() { const prev = stack.at(-2); return prev ? `<button class="back" data-back>${prev.t === 'i' ? L().back : L().backP}</button>` : ''; }
const scroller = () => { const inf = LBB.querySelector('.info'); return inf && inf.scrollHeight > inf.clientHeight + 1 && getComputedStyle(inf).overflowY === 'auto' ? inf : LBD; };
function show(dir, sc = 0) {   // dir: 1 前进, -1 返回, 0 原地刷新
  const v = stack.at(-1);
  LBB.className = 'lb' + (v.t === 'p' ? ' lbp' : '');
  LBB.innerHTML = v.t === 'i' ? itemHTML(v.id) : personHTML(v.id, v.mk);
  LBD.setAttribute('aria-label', v.t === 'i' ? L().lb : L().pc);
  if (dir) { void LBB.offsetWidth; LBB.classList.add(dir > 0 ? 'fwd' : 'bwd'); }
  if (!LBD.open) LBD.showModal();
  if (dir || sc) { LBD.scrollTop = 0; const inf = LBB.querySelector('.info'); if (inf) inf.scrollTop = 0; scroller().scrollTop = sc; }
  if (v.t === 'i') { const l = [...document.querySelectorAll('#main .card')].map(c => c.dataset.id), k = l.indexOf(v.id); if (k >= 0) { warm(l[(k + 1) % l.length]); warm(l[(k - 1 + l.length) % l.length]); } }
}
function push(v) {
  if (v.t === 'i' ? !byId[v.id] : !(v.mk ? MAKERS[v.id] : PEOPLE[v.id])) return;
  const top = stack.at(-1); if (top && top.t === v.t && top.id === v.id) return;
  if (top) top.sc = scroller().scrollTop;
  stack.push(v); history.pushState({ gd: stack.length }, ''); show(1);
}
function pop() { if (stack.length > 1) { stack.pop(); show(-1, stack.at(-1).sc || 0); } else closeLb(true); }
function closeLb(fromHistory) {
  const n = stack.length; stack.length = 0; if (LBD.open) LBD.close();
  if (!fromHistory && n) { skipPop++; history.go(-n); }
}
function openItem(id) { push({ t: 'i', id }); }
function openPerson(pid, isMaker) { push({ t: 'p', id: pid, mk: !!isMaker }); }
addEventListener('popstate', () => { if (skipPop) { skipPop--; return; } if (stack.length) pop(); });
LBD.addEventListener('cancel', e => { e.preventDefault(); history.back(); });   // Esc：和系统返回一致

// ---------- 事件 ----------
document.addEventListener('click', e => {
  const t = e.target;
  const per = t.closest('[data-person]'), mk = t.closest('[data-maker]'), op = t.closest('[data-open]'), st = t.closest('[data-step]');
  if (t.closest('[data-back]')) { history.back(); return; }
  if (t.closest('[data-close]')) { const d = t.closest('dialog'); d === LBD ? closeLb() : d.close(); return; }
  if (t === LBD) { closeLb(); return; }
  if (t.tagName === 'DIALOG') { t.close(); return; }
  if (per) { openPerson(per.dataset.person); return; }
  if (mk) { openPerson(mk.dataset.maker, true); return; }
  if (st) { step(+st.dataset.step); return; }
  if (op) openItem(op.dataset.open);
});
document.getElementById('lb').addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });

function applyLang() {
  const u = L(); root.lang = isEn() ? 'en' : 'zh-CN'; document.title = u.title;
  document.getElementById('h1').innerHTML = u.h1; document.getElementById('intro').innerHTML = u.intro;
  document.getElementById('pplh').textContent = u.ppl; document.getElementById('fnote').textContent = u.fnote;
  const s = document.querySelectorAll('#sort button'); s[0].textContent = u.byCat; s[1].textContent = u.byYear;
  const lb = document.getElementById('lang'); lb.innerHTML = u.langBtn; lb.setAttribute('aria-label', u.langLabel); lb.title = u.langLabel;
  document.getElementById('theme').setAttribute('aria-label', u.theme); document.getElementById('theme').title = u.theme;
  document.querySelector('.corner').setAttribute('aria-label', u.group);
  document.getElementById('lb').setAttribute('aria-label', u.lb); document.getElementById('pc').setAttribute('aria-label', u.pc);
  renderCounts(); renderTabs(); renderRuler(); render(); renderPeople(); renderCredits();
  if (LBD.open && stack.length) show(0);
}
document.getElementById('lang').onclick = () => { lang = isEn() ? 'zh' : 'en'; try { localStorage.setItem('gd-lang', lang); } catch {} applyLang(); };
applyLang();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
